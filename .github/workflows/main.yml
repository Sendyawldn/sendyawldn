name: generate profile graphics

concurrency:
    group: profile-graphics
    cancel-in-progress: false

on:
    schedule: # jalan otomatis tiap 24 jam
        - cron: '0 0 * * *'
    workflow_dispatch: # bisa dijalankan manual dari tab Actions
    push:
        branches:
            - main

jobs:
    # job 1: snake & pacman -> disimpan di branch "output"
    snake-and-pacman:
        permissions:
            contents: write
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: generate contribution snake
              uses: Platane/snk/svg-only@v3
              with:
                  github_user_name: ${{ github.repository_owner }}
                  outputs: |
                      dist/github-contribution-grid-snake.svg
                      dist/github-contribution-grid-snake-dark.svg?palette=github-dark
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: generate pacman contribution graph
              uses: abozanona/pacman-contribution-graph@main
              with:
                  github_user_name: ${{ github.repository_owner }}
                  games: 'pacman'

            - name: push generated SVGs to the output branch
              uses: crazy-max/ghaction-github-pages@v3.1.0
              with:
                  target_branch: output
                  build_dir: dist
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # job 2: stats, top-langs & trophy -> disimpan langsung di branch "main"
    stats-and-trophy:
        permissions:
            contents: write
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - uses: actions/checkout@v4

            - name: generate stats card
              uses: stats-organization/github-readme-stats-action@v2
              with:
                  card: stats
                  options: 'username=${{ github.repository_owner }}&show_icons=true&theme=github_dark&hide_border=true&bg_color=0D1117&title_color=58A6FF&icon_color=58A6FF&text_color=8B949E'
                  path: profile/stats.svg
                  token: ${{ secrets.PROFILE_TOKEN }}

            - name: generate top languages card
              uses: stats-organization/github-readme-stats-action@v2
              with:
                  card: top-langs
                  options: 'username=${{ github.repository_owner }}&layout=compact&theme=github_dark&hide_border=true&bg_color=0D1117&title_color=58A6FF&text_color=8B949E'
                  path: profile/top-langs.svg
                  token: ${{ secrets.PROFILE_TOKEN }}

            - name: generate trophy card
              uses: Erik-Donath/github-profile-trophy@feature/generate-svg
              with:
                  username: ${{ github.repository_owner }}
                  file: profile/trophy.svg
                  token: ${{ secrets.PROFILE_TOKEN }}

            - name: commit generated cards to main
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add profile/*.svg
                  git commit -m "chore: update profile cards [skip ci]" || echo "no changes to commit"
                  git pull --rebase origin main
                  git push
